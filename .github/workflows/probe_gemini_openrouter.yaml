name: Probe selected OpenRouter models (paid)

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: Confirm paid requests capped at 2048 output tokens each
        required: true
        default: false
        type: boolean
      target:
        description: Select all models or one model to probe
        required: true
        default: all
        type: choice
        options:
          - all
          - anthropic/claude-fable-5.1
          - anthropic/claude-opus-5
          - openai/gpt-5.6-sol
          - openai/gpt-5.6-terra
          - google/gemini-3.8-flash
          - google/gemini-3.7-flash
          - gemini-byok-audit

permissions:
  contents: read

jobs:
  probe:
    if: ${{ inputs.confirm_paid }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send selected capped prompts
        env:
          OPENROUTER_KEY: ${{ secrets.OAI_ANTH_OPENROUTER_KEY }}
          TARGET_MODEL: ${{ inputs.target }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          CHAT_URL = "https://openrouter.ai/api/v1/chat/completions"
          USER_MODELS_URL = "https://openrouter.ai/api/v1/models/user"
          MODEL_SPECS = (
              ("anthropic/claude-fable-5.1", "high"),
              ("anthropic/claude-opus-5", "high"),
              ("openai/gpt-5.6-sol", "high"),
              ("openai/gpt-5.6-terra", "high"),
              ("google/gemini-3.8-flash", "high"),
              ("google/gemini-3.7-flash", "high"),
          )
          PROMPT = "Reply with exactly: OK"
          MAX_TOKENS = 2048


          def safe_text(value: object, api_key: str) -> str:
              text = value if isinstance(value, str) else json.dumps(value, ensure_ascii=False)
              return text.replace(api_key, "[REDACTED]").replace("`", "'")


          def discover_gemini_models(api_key: str) -> tuple[tuple[str, None], ...]:
              request = urllib.request.Request(
                  USER_MODELS_URL,
                  headers={"Authorization": f"Bearer {api_key}", "Accept": "application/json"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.load(response)

              model_ids: list[str] = []
              for model in payload.get("data", []):
                  model_id = model.get("id", "")
                  if not model_id.startswith("google/gemini-"):
                      continue
                  output_modalities = (model.get("architecture") or {}).get("output_modalities") or []
                  if output_modalities and "text" not in output_modalities:
                      continue
                  model_ids.append(model_id)
              return tuple((model_id, None) for model_id in sorted(set(model_ids)))


          def routing_metadata(payload: dict) -> tuple[object, object]:
              router = payload.get("openrouter_metadata") or {}
              error_metadata = (payload.get("error") or {}).get("metadata") or {}
              is_byok = router.get("is_byok", error_metadata.get("is_byok", "unknown"))
              provider = router.get("summary", error_metadata.get("provider_name", "unknown"))
              return is_byok, provider


          def probe(
              model: str,
              effort: str | None,
              api_key: str,
              max_tokens: int = MAX_TOKENS,
          ) -> tuple[bool, bool, list[str]]:
              payload = {
                  "model": model,
                  "messages": [{"role": "user", "content": PROMPT}],
                  "max_tokens": max_tokens,
              }
              if effort:
                  payload["reasoning"] = {"effort": effort, "exclude": True}
              request = urllib.request.Request(
                  CHAT_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                      "X-OpenRouter-Metadata": "enabled",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.load(response)
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(body)
                      detail = parsed.get("error", {}).get("message", body)
                  except json.JSONDecodeError:
                      parsed = {}
                      detail = body
                  is_byok, provider = routing_metadata(parsed)
                  return False, is_byok in {True, False}, [
                      f"## `{model}`",
                      "",
                      f"- Reasoning effort: {effort or 'model default'}",
                      f"- Result: failed (HTTP {exc.code})",
                      f"- BYOK: {is_byok}",
                      f"- Provider routing: `{safe_text(provider, api_key)}`",
                      f"- Error: `{safe_text(detail, api_key)}`",
                      "",
                  ]
              except urllib.error.URLError as exc:
                  return False, False, [
                      f"## `{model}`",
                      "",
                      f"- Reasoning effort: {effort or 'model default'}",
                      "- Result: failed (request error)",
                      "- BYOK: unknown",
                      f"- Error: `{safe_text(exc.reason, api_key)}`",
                      "",
                  ]

              choices = result.get("choices", [])
              message = choices[0].get("message", {}) if choices else {}
              content = message.get("content", "")
              usage = result.get("usage", {})
              completion_details = usage.get("completion_tokens_details", {}) or {}
              is_byok, provider = routing_metadata(result)
              lines = [
                  f"## `{model}`",
                  "",
                  f"- Reasoning effort: {effort or 'model default'}",
                  f"- Result: success (HTTP {status})",
                  f"- BYOK: {is_byok}",
                  f"- Provider routing: `{safe_text(provider, api_key)}`",
                  f"- Resolved model: `{safe_text(result.get('model', 'n/a'), api_key)}`",
                  f"- Response: `{safe_text(content, api_key)}`",
                  f"- Prompt tokens: {usage.get('prompt_tokens', 'n/a')}",
                  f"- Completion tokens: {usage.get('completion_tokens', 'n/a')}",
                  f"- Reasoning tokens: {completion_details.get('reasoning_tokens', 'n/a')}",
                  f"- Total tokens: {usage.get('total_tokens', 'n/a')}",
                  f"- Cost: {usage.get('cost', 'n/a')}",
                  "",
              ]
              return True, is_byok in {True, False}, lines


          api_key = os.environ.get("OPENROUTER_KEY", "")
          if not api_key:
              raise SystemExit("OAI_ANTH_OPENROUTER_KEY is not configured")

          target = os.environ.get("TARGET_MODEL", "all")
          audit_mode = target == "gemini-byok-audit"
          if audit_mode:
              selected_specs = discover_gemini_models(api_key)
          else:
              selected_specs = (
                  MODEL_SPECS if target == "all" else tuple(spec for spec in MODEL_SPECS if spec[0] == target)
              )
          if not selected_specs:
              raise SystemExit(f"Unsupported target model: {target}")

          summary_lines = [
              "# Selected-model donated-key smoke test",
              "",
              f"Prompt: `{PROMPT}`",
              f"Output cap: {16 if audit_mode else MAX_TOKENS} tokens per model",
              "",
          ]
          failed = False
          routing_unknown = False
          for model, effort in selected_specs:
              succeeded, routing_known, lines = probe(
                  model,
                  effort,
                  api_key,
                  max_tokens=16 if audit_mode else MAX_TOKENS,
              )
              summary_lines.extend(lines)
              failed = failed or (not succeeded and not audit_mode)
              routing_unknown = routing_unknown or not routing_known

          summary = "\n".join(summary_lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(summary + "\n")

          if failed or routing_unknown:
              sys.exit(1)
          PY
