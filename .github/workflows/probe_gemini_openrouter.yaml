name: Probe selected OpenRouter models (paid)

on:
  workflow_dispatch:
    inputs:
      confirm_paid:
        description: Confirm six paid requests capped at 2048 output tokens each
        required: true
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  probe:
    if: ${{ inputs.confirm_paid }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Send six capped prompts
        env:
          OPENROUTER_KEY: ${{ secrets.OAI_ANTH_OPENROUTER_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import sys
          import urllib.error
          import urllib.request

          CHAT_URL = "https://openrouter.ai/api/v1/chat/completions"
          MODEL_SPECS = (
              ("anthropic/claude-fable-5.1", "high"),
              ("anthropic/claude-opus-5", "high"),
              ("openai/gpt-5.6-sol", "high"),
              ("openai/gpt-5.6-terra", "high"),
              ("google/gemini-3.8-flash", "high"),
              ("google/gemini-3.7-flash", "high"),
          )
          PROMPT = "Reply with exactly: OK"
          MAX_TOKENS = 2048


          def safe_text(value: object, api_key: str) -> str:
              text = value if isinstance(value, str) else json.dumps(value, ensure_ascii=False)
              return text.replace(api_key, "[REDACTED]").replace("`", "'")


          def probe(model: str, effort: str | None, api_key: str) -> tuple[bool, list[str]]:
              payload = {
                  "model": model,
                  "messages": [{"role": "user", "content": PROMPT}],
                  "max_tokens": MAX_TOKENS,
              }
              if effort:
                  payload["reasoning"] = {"effort": effort, "exclude": True}
              request = urllib.request.Request(
                  CHAT_URL,
                  data=json.dumps(payload).encode("utf-8"),
                  headers={
                      "Authorization": f"Bearer {api_key}",
                      "Content-Type": "application/json",
                      "Accept": "application/json",
                  },
                  method="POST",
              )

              try:
                  with urllib.request.urlopen(request, timeout=60) as response:
                      result = json.load(response)
                      status = response.status
              except urllib.error.HTTPError as exc:
                  body = exc.read().decode("utf-8", errors="replace")
                  try:
                      parsed = json.loads(body)
                      detail = parsed.get("error", {}).get("message", body)
                  except json.JSONDecodeError:
                      detail = body
                  return False, [
                      f"## `{model}`",
                      "",
                      f"- Reasoning effort: {effort or 'model default'}",
                      f"- Result: failed (HTTP {exc.code})",
                      f"- Error: `{safe_text(detail, api_key)}`",
                      "",
                  ]
              except urllib.error.URLError as exc:
                  return False, [
                      f"## `{model}`",
                      "",
                      f"- Reasoning effort: {effort or 'model default'}",
                      "- Result: failed (request error)",
                      f"- Error: `{safe_text(exc.reason, api_key)}`",
                      "",
                  ]

              choices = result.get("choices", [])
              message = choices[0].get("message", {}) if choices else {}
              content = message.get("content", "")
              usage = result.get("usage", {})
              completion_details = usage.get("completion_tokens_details", {}) or {}
              lines = [
                  f"## `{model}`",
                  "",
                  f"- Reasoning effort: {effort or 'model default'}",
                  f"- Result: success (HTTP {status})",
                  f"- Resolved model: `{safe_text(result.get('model', 'n/a'), api_key)}`",
                  f"- Response: `{safe_text(content, api_key)}`",
                  f"- Prompt tokens: {usage.get('prompt_tokens', 'n/a')}",
                  f"- Completion tokens: {usage.get('completion_tokens', 'n/a')}",
                  f"- Reasoning tokens: {completion_details.get('reasoning_tokens', 'n/a')}",
                  f"- Total tokens: {usage.get('total_tokens', 'n/a')}",
                  f"- Cost: {usage.get('cost', 'n/a')}",
                  "",
              ]
              return True, lines


          api_key = os.environ.get("OPENROUTER_KEY", "")
          if not api_key:
              raise SystemExit("OAI_ANTH_OPENROUTER_KEY is not configured")

          summary_lines = [
              "# Selected-model donated-key smoke test",
              "",
              f"Prompt: `{PROMPT}`",
              f"Output cap: {MAX_TOKENS} tokens per model",
              "",
          ]
          failed = False
          for model, effort in MODEL_SPECS:
              succeeded, lines = probe(model, effort, api_key)
              summary_lines.extend(lines)
              failed = failed or not succeeded

          summary = "\n".join(summary_lines)
          print(summary)
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as summary_file:
              summary_file.write(summary + "\n")

          if failed:
              sys.exit(1)
          PY
