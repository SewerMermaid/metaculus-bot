name: Forecast on new MiniBench questions (Astra)

on:
  workflow_dispatch:
  schedule:
    # Ten minutes after the regular MiniBench workflow (:08/:38), and clear
    # of the FutureEval workflow (:03/:23/:43), to spread API traffic.
    - cron: "18 * * * *"
    - cron: "48 * * * *"

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  forecast_job:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        id: setup-python
        with:
          python-version: "3.11"
      - name: Install poetry
        uses: snok/install-poetry@v1
        continue-on-error: true
        with:
          version: 2.2.1
          virtualenvs-create: true
          virtualenvs-in-project: true
          installer-parallel: true
      - name: Ensure Poetry is available (fallback install)
        run: |
          poetry --version || (
            python -m pip install -U pip &&
            for i in 1 2 3; do
              python -m pip install "poetry==2.2.1" && break || sleep 10;
            done &&
            poetry --version
          )
      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v5
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}
      - name: Install dependencies
        uses: nick-fields/retry@v4
        with:
          max_attempts: 3
          retry_on: error
          timeout_minutes: 10
          command: poetry install --no-interaction --no-root
        env:
          POETRY_VIRTUALENVS_CREATE: true
          POETRY_VIRTUALENVS_IN_PROJECT: true
          POETRY_INSTALLER_PARALLEL: true
      - name: Run bot
        run: |
          poetry run python main.py --mode minibench_astra
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN_TEST }}
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OAI_ANTH_OPENROUTER_KEY: ${{ secrets.OAI_ANTH_OPENROUTER_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          ASKNEWS_MAX_CONCURRENCY: '1'
          ASKNEWS_MAX_RPS: '0.2'
          NATIVE_SEARCH_ENABLED: 'true'
          FINANCIAL_DATA_ENABLED: 'true'
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          GEMINI_SEARCH_ENABLED: 'false'
          GAP_FILL_ENABLED: 'false'
          PROBABILISTIC_TOOLS_ENABLED: 'true'
          PROBABILISTIC_TOOLS_TYPES: 'binary,multiple_choice'
          PREDICTION_MARKETS_ENABLED: 'true'
          NUMERIC_STACKING_ENABLED: 'false'
          BINARY_STACKING_ENABLED: 'false'
          MC_STACKING_ENABLED: 'false'
          OPENAI_AGENTS_DISABLE_TRACING: 'true'
          PERSIST_RESEARCH_ENABLED: 'true'
      - name: Upload research outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-astra-${{ github.run_id }}
          path: research_outputs/
          retention-days: 180
          if-no-files-found: ignore
